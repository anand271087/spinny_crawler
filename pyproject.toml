[project]
name = "spinny-oem-crawler"
version = "0.1.0"
description = "Monthly OEM spare-parts catalogue crawler for Spinny — 19 brands"
requires-python = ">=3.11"
dependencies = [
    "scrapy>=2.11",
    "playwright>=1.45",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
spinny-crawl = "orchestrator.run_monthly:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orchestrator", "spiders", "lib"]

[tool.ruff]
line-length = 100
target-version = "py311"
